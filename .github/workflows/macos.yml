name: macOS app

on:
  push:
    branches: [main, 'feat/macos-*']
    paths: ['twinkle_macos/**', 'twinkle_desktop/assets/**', 'twinkle_desktop/library/**', 'twinkle_twinkle/**', 'scripts/**', 'index.html', '.github/workflows/macos.yml']
  pull_request:
    paths: ['twinkle_macos/**', 'twinkle_desktop/assets/**', 'twinkle_desktop/library/**', 'twinkle_twinkle/**', 'scripts/**', 'index.html', '.github/workflows/macos.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build universal app and run native tests
        run: bash scripts/build_macos.sh
      - name: Upload preview installers and checksums
        uses: actions/upload-artifact@v4
        with:
          name: TwinkleAgent-macOS-${{ matrix.os }}
          path: dist/macos/
          if-no-files-found: error
          retention-days: 30
