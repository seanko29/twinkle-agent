<body><div class="wrap"><header><a class="brand" href="#"><span>✦</span>Twinkle Agent</a><div class="language" role="group" aria-label="Language"><button type="button" data-language="ko" aria-pressed="true">KOR</button><button type="button" data-language="en" aria-pressed="false">ENG</button></div></header>
<main><section class="hero"><div><div class="eyebrow">A LITTLE COMPANY FOR YOUR DESKTOP</div><h1 data-ko="오늘도, 트윙클과 함께." data-en="A little company.\nA brighter workday.">오늘도, 트윙클과 함께.</h1><p data-ko="바탕 화면을 조용히 걷고, 집중할 땐 응원하고, 쉴 땐 같이 쉬는 작은 친구. Windows와 macOS용 트윙클 에이전트 사용 안내예요." data-en="A small companion that wanders across your desktop, cheers you on, and takes a break with you. A guide to Twinkle Agent for Windows and macOS."></p><div class="actions"><a class="button" href="https://github.com/seanko29/twinkle-agent/releases/latest" data-ko="Windows 다운로드 ↗" data-en="Download for Windows ↗"></a><a class="button secondary" href="https://github.com/seanko29/twinkle-agent/actions/workflows/macos.yml" data-ko="macOS 시험 버전 ↗" data-en="macOS preview ↗"></a><a class="button secondary gallery-link" href="twinkle_twinkle/index.html" data-ko="이미지 47개 둘러보기" data-en="Explore 47 animations"></a></div></div><figure class="art" style="margin:0"><img id="walk-preview" src="twinkle_desktop/walk_preview.gif" alt="Twinkle Agent strawberry-hat walking preview"><figcaption class="caption" data-ko="원본 캐릭터 이미지를 바탕으로 발만 작게 움직이는 걷기 동작" data-en="Small alternating footsteps derived from an existing character image"></figcaption></figure></section>
<section class="section" id="macos"><h2 data-ko="Mac에서도 함께 · 시험 버전" data-en="A companion for Mac · preview"></h2><div class="columns"><div><h3 data-ko="macOS 12+ · Apple Silicon / Intel" data-en="macOS 12+ · Apple Silicon / Intel"></h3><p data-ko="macOS 빌드 페이지에서 성공한 실행을 열고 Artifacts를 받으세요. GitHub 로그인이 필요하며 파일은 30일 보관됩니다. DMG 안의 앱을 Applications로 드래그한 뒤 실행하세요. 캐릭터 클릭 또는 메뉴 막대 ✦에서 조작합니다." data-en="Open a successful macOS workflow run and download its artifact (GitHub sign-in required; 30-day retention). Open the DMG and drag the app to Applications. Click the character or use the ✦ menu bar icon."></p><p><a href="https://github.com/seanko29/twinkle-agent/blob/feat/macos-desktop/docs/macOS.md" data-ko="Mac 설치·빌드 상세 안내 ↗" data-en="Mac installation and build details ↗"></a></p></div><div><h3 data-ko="이동·타이머·47개 이미지" data-en="Roaming, timers, 47 animations"></h3><p data-ko="드래그, 집중·휴식·회의·퇴근, 일시정지, 이미지 추가와 한국어/English UI를 지원해요. Control 또는 Command + 스크롤로 크기를 조절해요. Mail 앱의 메일을 ChatGPT 구독이나 공식 Claude Code로 요약하고 할 일을 정리할 수 있어요. 선택한 본문은 해당 AI로 전송돼요. 브라우저 완료 알림은 Windows 전용이에요. 현재 시험 배포본은 Apple Developer ID 서명·공증 전이라 macOS가 실행을 차단할 수 있어요." data-en="Supports dragging, Focus/Rest/Meeting/Off work, pause/resume, image import, and Korean/English UI. Control or Command + scroll resizes. Connect Apple Mail with a ChatGPT plan or official Claude Code for summaries and next actions. Selected message bodies go to the chosen AI. Browser completion signals remain Windows-only. This ad-hoc signed preview is not Developer ID signed or notarized; macOS may block a downloaded copy."></p></div></div></section>
<section class="section"><h2 data-ko="Windows에서 시작하기" data-en="Get started on Windows"></h2><div class="steps"><article class="card"><span class="number">01 / INSTALL</span><h3 data-ko="설치 파일 실행" data-en="Run the installer"></h3><p data-ko="Releases에서 TwinkleDesktop_Setup.exe를 받아 설치하세요. Windows 10/11과 .NET Framework 4.8 이상이 필요해요. 관리자 권한은 필요 없어요." data-en="Download TwinkleDesktop_Setup.exe from Releases. Requires Windows 10/11 and .NET Framework 4.8 or later. No administrator privileges required."></p></article><article class="card"><span class="number">02 / SAY HELLO</span><h3 data-ko="캐릭터를 클릭하세요" data-en="Click your companion"></h3><p data-ko="집중·휴식·회의·퇴근 버튼이 나타나요. 캐릭터를 드래그해서 원하는 위치에 놓을 수 있어요." data-en="Click the character to show Focus, Rest, Meeting, and Off work. Drag it to your preferred spot. The desktop app currently uses Korean labels."></p></article><article class="card"><span class="number">03 / MAKE IT YOURS</span><h3 data-ko="크기와 표정 바꾸기" data-en="Make it yours"></h3><p data-ko="우클릭 메뉴에서 크기를 조절하고 상황별 이미지를 선택하세요. Ctrl + 마우스 휠로도 바로 크기를 바꿀 수 있어요." data-en="Right-click to resize or choose images for each activity. Ctrl + mouse wheel changes the character size instantly."></p></article></div></section>
<section class="section"><h2 data-ko="오늘의 모드" data-en="Pick your mood"></h2><div class="modes"><div class="mode"><b data-ko="집중" data-en="Focus · 집중"></b><span data-ko="두 별이 응원해요. 경과 시간을 재고, 일시정지·다시 시작할 수 있어요." data-en="Two stars cheer you on. Track elapsed time, pause, and resume."></span></div><div class="mode"><b data-ko="휴식" data-en="Rest · 휴식"></b><span data-ko="졸림과 하품. 쉬는 동안엔 현재 자리에서 움직여요." data-en="Sleepy yawns while taking a break in the same spot."></span></div><div class="mode"><b data-ko="회의" data-en="Meeting · 회의"></b><span data-ko="갸우뚱하는 표정으로 함께 회의해요." data-en="A curious head tilt to keep you company during meetings."></span></div><div class="mode"><b data-ko="퇴근" data-en="Off work · 퇴근"></b><span data-ko="커튼 뒤에서 인사한 뒤, 딸기 모자로 다시 걸어요." data-en="A curtain farewell, then a quiet stroll in a strawberry hat."></span></div></div></section>
<section class="section columns"><div><h2 data-ko="내 취향대로" data-en="Personalize"></h2><ul><li data-ko="크기: 우클릭 슬라이더, ±8px, Ctrl + 휠. 80~320px 범위예요." data-en="Size: right-click slider, ±8px steps, or Ctrl + wheel. Range: 80–320px."></li><li data-ko="상황별 이미지 바꾸기: 수집한 47개 중 고르거나 내 GIF·APNG·PNG·JPG를 추가하세요." data-en="Images: select from 47 animations or import your own GIF, APNG, PNG, or JPG."></li><li data-ko="자유롭게 돌아다니기: 우클릭으로 켜고 끌 수 있어요." data-en="Roaming: toggle 자유롭게 돌아다니기 in the right-click menu."></li><li data-ko="숨기기·종료: 우클릭 또는 Windows 알림 영역의 트윙클 아이콘을 사용하세요." data-en="Hide or exit: use the right-click menu or the Twinkle icon in the Windows notification area."></li></ul></div><div><h2 data-ko="Windows 연결 기능의 현재 상태" data-en="Windows connection status"></h2><ul><li data-ko="공개본에는 계정·비밀번호·API 키·OAuth 앱 등록 값이 들어 있지 않아요. 모든 계정은 미연결 상태로 시작해요." data-en="No accounts, passwords, API keys, or registered OAuth client credentials are included. Fresh installations start disconnected."></li><li data-ko="메일: Gmail·네이버·Outlook·회사 IMAP 연결 코드는 포함돼 있어요. Google/Microsoft는 별도 앱 등록, 네이버는 IMAP과 앱 비밀번호 설정이 필요해요." data-en="Mail integration code is included for Gmail, Naver, Outlook, and IMAP. Google/Microsoft require your own app registration; Naver requires IMAP and an app password."></li><li data-ko="메일 요약용 GPT·Claude·Gemini 연결은 아직 구현되지 않았어요." data-en="AI mail summarization with GPT, Claude, or Gemini is not implemented."></li><li data-ko="AI 웹 응답 완료 알림은 선택 기능이에요. 별도 Chrome/Edge 확장 설치와 감지 켜기가 필요하며, 사이트 변경에 영향을 받아요." data-en="Optional AI web-response notifications require the Chrome/Edge extension and explicit opt-in. Detection depends on the websites' UI."></li></ul></div></section>
<section class="section"><h2 data-ko="자주 찾는 도움말" data-en="Good to know"></h2><details><summary data-ko="가만히 서 있어요" data-en="The character is standing still"></summary><p data-ko="집중·휴식·회의 중에는 제자리에서 활동해요. 돌아다니게 하려면 퇴근 또는 우클릭 → 자유롭게 돌아다니기를 선택하세요. 걷는 사이 잠깐 쉬는 구간도 있어요. 메일 연결 창을 열어 둬도 이동은 계속돼요." data-en="Focus, Rest, and Meeting stay in place. Select Off work or enable roaming in the right-click menu to wander. Short pauses between walks are normal. Opening mail settings does not stop roaming."></p></details><details><summary data-ko="설정은 어디에 저장되나요?" data-en="Where are settings stored?"></summary><p data-ko="크기는 settings.json, 추가 이미지는 user_images, 본인이 나중에 연결한 메일 계정은 user_mail/accounts.dat에 저장돼요. 계정 파일은 현재 Windows 사용자용으로 암호화돼요. 이 파일들은 Git과 배포 묶음에서 제외돼요." data-en="Size preferences use settings.json; imported artwork uses user_images; accounts you connect later use user_mail/accounts.dat, encrypted for the current Windows user. These files are excluded from Git and release packages."></p></details><details><summary data-ko="브라우저 완료 알림은 어떻게 켜나요?" data-en="How do I enable browser notifications?"></summary><p data-ko="앱 폴더에서 install_browser_bridge.ps1을 실행하세요. Chrome/Edge 확장 페이지의 개발자 모드에서 browser_extension 폴더를 로드하고, 확장 팝업에서 감지를 켠 뒤 연결 테스트를 누르세요. 기존 AI 탭은 새로고침해야 해요. 대화 내용이나 API 키를 전송하지 않고 완료 신호만 전달해요." data-en="Run install_browser_bridge.ps1 from the app folder. Load browser_extension in the Chrome/Edge extensions page with Developer mode, enable detection in its popup, and test the connection. Refresh existing AI tabs. Only a completion signal is sent; chat contents and API keys are not transmitted."></p></details><details><summary data-ko="소스에서 직접 실행하려면?" data-en="Build from source"></summary><p data-ko="저장소를 받은 뒤 Windows PowerShell에서 scripts/build.ps1을 실행하세요. 생성된 twinkle_desktop/TwinkleDesktop.exe를 실행하면 돼요. scripts/verify_public.py로 공개 파일 구성을 검사할 수 있어요." data-en="Clone the repository and run scripts/build.ps1 in Windows PowerShell. Start twinkle_desktop/TwinkleDesktop.exe. Run scripts/verify_public.py to check the publication tree."></p></details>
<div class="notice" data-ko="팬 프로젝트이며 POP MART의 공식 앱이 아니에요. 캐릭터 이미지와 상표의 권리는 원 권리자에게 있어요. 각 이미지의 공개 출처를 갤러리에 남겼으며, 업로더의 공식성이나 재배포 이용 허가는 검증되지 않았어요. Windows 설치 파일은 코드 서명되지 않았고 Mac 시험 버전은 임시 서명이며 Apple 공증을 받지 않았어요." data-en="An unofficial fan project, not affiliated with POP MART. Character artwork and trademarks belong to their respective owners. Public source links are preserved in the gallery; uploader authenticity and redistribution permission have not been verified. Windows installers are unsigned; Mac previews are ad-hoc signed without Apple notarization."></div></section></main>

<script>
function setLanguage(language){const lang=language==='en'?'en':'ko';document.documentElement.lang=lang;document.querySelectorAll('[data-ko][data-en]').forEach(element=>element.textContent=element.dataset[lang].replace(/\\n/g,' '));document.querySelectorAll('[data-language]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.language===lang)));try{localStorage.setItem('twinkle-language',lang);const url=new URL(location.href);url.searchParams.set('lang',lang);history.replaceState(null,'',url)}catch{}document.querySelectorAll('.gallery-link').forEach(link=>link.href=document.documentElement.dataset.gallery+'?lang='+lang)}
document.querySelectorAll('[data-language]').forEach(button=>button.addEventListener('click',()=>setLanguage(button.dataset.language)));
document.querySelector('#walk-preview').src=document.documentElement.dataset.preview;let initialLanguage=new URLSearchParams(location.search).get('lang');if(!initialLanguage){try{initialLanguage=localStorage.getItem('twinkle-language')}catch{}}setLanguage(initialLanguage||'ko');
</script></body></html>
